[project]
name = "hireyi"
version = "0.1.0"
description = "AI-powered resume management and talent screening platform"
authors = [{ name = "HireyI Team" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database & Storage
    "supabase>=2.9.0",
    "sqlalchemy>=2.0.0",
    # Authentication
    "pyjwt>=2.9.0",
    # AI & LLM
    "litellm>=1.50.0",
    "openai>=1.50.0", # For OpenAI-compatible models
    # PDF Parsing
    "PyMuPDF>=1.23.8", # PyMuPDF (fitz)
    # File Storage
    "oss2>=2.18.0", # Aliyun OSS SDK
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.27.0",
    "backoff>=2.2.0", # Retry mechanism for AI services
    "tenacity>=9.0.0", # Alternative retry library
    "email-validator>=2.3.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",

    # Code Quality
    "ruff>=0.7.0",
    "basedpyright>=1.20.0",
    "pre-commit>=4.0.0",

    # Type Stubs
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ==================== Ruff Configuration ====================
[tool.ruff]
line-length = 88
target-version = "py311"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Use `raise from` within except clause
    "SIM105", # Use contextlib.suppress
]

# Allow autofix for specific rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*.py" = [
    "S101",   # Use of assert
    "ARG",    # Unused function arguments
    "FBT",    # Boolean trap
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==================== Basedpyright Configuration ====================
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# Directories to analyze
include = ["app", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

# Type checking strictness
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

# Allow some flexibility for common patterns
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalSubscript = false

# ==================== Pytest Configuration ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

# Custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ==================== Coverage Configuration ====================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ==================== Hatch Configuration ====================
[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.1.1",
]
